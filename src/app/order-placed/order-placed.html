<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
      <div class="p-5 bg-light border rounded-3 shadow-sm">
        <div class="mb-4">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem"></i>
        </div>

        <h1 class="fw-bold mb-3">Order Placed!</h1>

        <p class="fs-5 mb-4">
          Thank you for your order! Your guitars and accessories are on their way.
        </p>
        <p class="text-muted mb-4">
          A confirmation will be sent shortly. We appreciate your support of Devin's Guitar Store.
        </p>

        <div class="d-flex justify-content-center gap-3 flex-wrap">
          <a class="btn btn-primary" [routerLink]="['/guitar']">Continue Shopping</a>
          <a class="btn btn-outline-secondary" [routerLink]="['/']">Go Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
