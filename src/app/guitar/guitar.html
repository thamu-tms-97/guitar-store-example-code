<!--
  The following code is an HTML template for a guitar component in an Angular application.
  It displays a list of guitar products and includes buttons to proceed to the shopping cart.
  Additionally, it conditionally shows an error message if one exists.
-->

<div class="container">
  <div class="row">
    <div class="col text-center">
      <h1>Guitars</h1>
    </div>
  </div>

  <!-- Proceed to checkout button top -->
  <div class="row justify-content-center mb-3">
    <div class="col-auto">
      <button class="btn btn-primary btn-checkout" [routerLink]="['/shopping-cart']">
        Proceed to checkout
      </button>
    </div>
  </div>

  <!-- if show is true, show message from child component -->
  @if (message!.show) {
    <div class="row justify-content-center">
      <div class="col-12 col-md-10">
        <div class="alert alert-danger alert-dismissible mt-2" role="alert">
          {{ message!.text }}
          <button type="button" class="btn-close" (click)="clearErrorMessage()"></button>
        </div>
      </div>
    </div>
  }

  <!-- Bootstrap grid: responsive columns for guitar products -->
  <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-2 justify-content-center">
    @for (p of products | keyvalue; track p.key) {
      <app-product-item [prod]="p"></app-product-item>
    }
  </div>

  <!-- Proceed to checkout button bottom -->
  <div class="row justify-content-center mt-3 mb-4">
    <div class="col-auto">
      <button class="btn btn-primary btn-checkout" [routerLink]="['/shopping-cart']">
        Proceed to checkout
      </button>
    </div>
  </div>
</div>
